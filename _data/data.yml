experiences:
  title: Experience
  info:
  - role: Visiting Scientist - Policy Analyst / Foresight (Trainee)
    time: Apr 2026 - Nov 2026
    company: Joint Research Centre (JRC), European Commission - Brussels
    details: |
      - Support the EU Policy Lab's foresight work for strategic and corporate decision-making, developing future-oriented scenarios that connect scientific evidence with long-term regulatory and sustainability choices.
      - Apply sustainability assessment, data analysis and systems thinking to EU innovation and sustainability-policy questions.
      - Internal project in collaboration with DG AGRI (Agriculture and Rural Development).
      - Internal project in collaboration with DG ENER (Energy).

  - role: PhD Researcher - MSCA Fellow
    time: Sep 2023 - Present (completion expected Dec 2026 / Jan 2027)
    company: Empa & ETH Zurich - St. Gallen
    details: |
      - Develop Safe and Sustainable by Design methods that integrate environmental, safety and risk assessment into the early stages of pharmaceutical and nanomaterial innovation, before full datasets are available.
      - Led two industry-facing collaborations with Roche, including an LCA and energy-demand study and an SSbD case study on an early-stage pharmaceutical product.
      - Translate technical data into practical R&D decision-support insights, building on work published in the Journal of Cleaner Production.
      - Designed and built a software tool to estimate energy demand and climate impacts of chemical and industrial processes, filling the gap between back-of-the-envelope Excel calculations and data-intensive Aspen-type process simulations.
      - Enable early-stage screening when detailed process data are scarce, helping identify energy and climate hotspots before process development becomes more advanced.
      - Contribute to the EU-funded MELOMANES project on sustainable nanomedicine, collaborating with academic and industrial stakeholders.

  - role: R&D LCA Trainee
    time: Feb 2023 - Jul 2023
    company: GVS Filter Technology - Bologna
    details: |
      - Delivered a Life Cycle Assessment and mass-flow analysis of medical-device production using SimaPro.
      - Identified process hotspots and potential lower-impact manufacturing options to support R&D decision-making.

  - role: Climate Leadership Journey
    time: Apr 2022 - Dec 2022
    company: Climate-KIC - Lisbon
    details: |
      - Selected for an international climate-innovation programme.
      - Applied systems thinking to propose solutions supporting Lisbon's net-zero transition.

  - role: Tutor, Industrial Chemistry
    time: 2021 - 2022
    company: University of Bologna
    details: |
      - Supported students in the Industrial Chemistry programme.

