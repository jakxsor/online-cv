career-profile:
  title: Profile
  summary: |
    Sustainability scientist working at the interface between industrial R&D, environmental assessment and EU policy. I apply Life Cycle Assessment, Safe and Sustainable by Design (SSbD), environmental risk assessment and occupational exposure assessment to turn early-stage technical data into decision-support insights for companies and policy-oriented stakeholders.

    My work focuses on identifying environmental, safety, resource-use and process hotspots before they become locked into late-stage product or process development. I have experience across industrial collaborations, including Roche and GVS, and policy-oriented foresight work at the European Commission's Joint Research Centre. I also develop practical screening tools that make complex sustainability methods usable in early-stage contexts, when data are still incomplete.

    Sectors: pharmaceuticals, chemicals, advanced materials, nanomedicine and medical devices.

